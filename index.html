// ----- local media store (public demo: photos & video stay on this device) -----
const LURL = {};
const idb = {
  db: null,
  open(){ return new Promise((res, rej) => { try { const r = indexedDB.open("marebook-media", 1); r.onupgradeneeded = () => r.result.createObjectStore("blobs"); r.onsuccess = () => res(this.db = r.result); r.onerror = () => rej(r.error); } catch(e){ rej(e); } }); },
  store(mode){ return this.db.transaction("blobs", mode).objectStore("blobs"); }
};
async function shrinkImage(file){
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file), k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 600000) return file;
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || file), "image/jpeg", .86));
  } catch(_){ return file; }
}
const localAssets = {
  async upload(blob, opt){
    if (blob.size > 20 * 1024 * 1024) throw {code:"too_large"};
    if (!idb.db) await idb.open();
    const b = await shrinkImage(blob), id = uid() + uid();
    await new Promise((res, rej) => { const rq = idb.store("readwrite").put(b, id); rq.onsuccess = res; rq.onerror = () => rej(rq.error); });
    LURL[id] = URL.createObjectURL(b);
    return {id, url:LURL[id], sizeBytes:b.size, contentType:(opt && opt.type) || b.type};
  },
  async delete(id){ try { if (!idb.db) await idb.open(); idb.store("readwrite").delete(id); } catch(_){} if (LURL[id]) URL.revokeObjectURL(LURL[id]); delete LURL[id]; return {deleted:true}; },
  async loadAll(){ await idb.open(); await new Promise(res => { const rq = idb.store("readonly").openCursor(); rq.onsuccess = () => { const c = rq.result; if (!c){ res(); return; } LURL[c.key] = URL.createObjectURL(c.value); c.continue(); }; rq.onerror = () => res(); }); },
  async clear(){ try { if (!idb.db) await idb.open(); idb.store("readwrite").clear(); } catch(_){} }
};

// ----- typeahead (My Mares, Foals, My Stallions, Stallion Search) -----
const COMBO = {};
function combo(id, ph, items){
  COMBO[id] = items;
  return `<div class="combo"><input class="search" type="search" id="${id}" data-combo="${id}" role="combobox" aria-expanded="false" aria-controls="${id}-lb" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="${esc(ph)}"><ul class="lb" id="${id}-lb" role="listbox" hidden></ul></div>`;
}
const hl = (label, q) => { const s = esc(label); if (!q) return s; const i = label.toLowerCase().indexOf(q); return i < 0 ? s : esc(label.slice(0,i)) + "<mark>" + esc(label.slice(i, i+q.length)) + "</mark>" + esc(label.slice(i+q.length)); };
function comboFilter(input){
  const id = input.dataset.combo, q = input.value.trim().toLowerCase(), items = COMBO[id] || [], lb = document.getElementById(id + "-lb"); if (!lb) return;
  const score = it => { const l = it.label.toLowerCase(); return l.startsWith(q) ? 0 : l.split(/\s+/).some(w => w.startsWith(q)) ? 1 : 2; };
  let list = items.filter(it => !q || it.label.toLowerCase().includes(q) || (it.sub || "").toLowerCase().includes(q));
  list.sort((a,b) => (a.group || "").localeCompare(b.group || "") || (q ? score(a) - score(b) : 0) || a.label.localeCompare(b.label));
  list = list.slice(0, 50);
  let html = "", g = null;
  list.forEach((it, i) => {
    if (it.group && it.group !== g){ g = it.group; html += `<li class="grp" role="presentation">${esc(g)}</li>`; }
    html += `<li role="option" id="${id}-o${i}" data-ref="${esc(it.ref)}" aria-selected="${i === 0 && q ? "true" : "false"}"><span>${hl(it.label, q)}</span>${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</li>`;
  });
  if (!list.length) html = `<li class="none" role="presentation">${items.length ? "No match. Check the spelling or add a new one." : "None added yet."}</li>`;
  lb.innerHTML = html; lb.hidden = false; input.setAttribute("aria-expanded", "true");
}
function comboClose(input){ const lb = document.getElementById(input.dataset.combo + "-lb"); if (lb) lb.hidden = true; input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); }
function comboPick(input, li){ if (!li || !li.dataset.ref) return; input.value = ""; comboClose(input); openHorse(li.dataset.ref); }
document.addEventListener("focusin", ev => { const t = ev.target; if (t.dataset && t.dataset.combo) comboFilter(t); });
document.addEventListener("input", ev => { const t = ev.target; if (t.dataset && t.dataset.combo) comboFilter(t); });
document.addEventListener("focusout", ev => { const t = ev.target; if (t.dataset && t.dataset.combo) setTimeout(() => { if (document.activeElement !== t) comboClose(t); }, 160); });
document.addEventListener("keydown", ev => {
  const t = ev.target; if (!t.dataset || !t.dataset.combo) return;
  const lb = document.getElementById(t.dataset.combo + "-lb"); if (!lb) return;
  const opts = [...lb.querySelectorAll('[role="option"]')]; let i = opts.findIndex(o => o.getAttribute("aria-selected") === "true");
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault(); if (lb.hidden) comboFilter(t);
    i = ev.key === "ArrowDown" ? Math.min(opts.length - 1, i + 1) : Math.max(0, i - 1);
    opts.forEach((o, j) => o.setAttribute("aria-selected", j === i ? "true" : "false"));
    if (opts[i]){ opts[i].scrollIntoView({block:"nearest"}); t.setAttribute("aria-activedescendant", opts[i].id); }
  } else if (ev.key === "Enter"){ ev.preventDefault(); comboPick(t, opts[i >= 0 ? i : 0]); }
  else if (ev.key === "Escape"){ comboClose(t); }
});
document.addEventListener("mousedown", ev => { const li = ev.target.closest(".combo [role=option]"); if (!li) return; ev.preventDefault(); comboPick(li.closest(".combo").querySelector("[data-combo]"), li); });

// ----- mini month calendar (member home, foal page) -----
function miniCal(key, filter){
  const ym = ui[key] || TODAY.slice(0,7), [y, mo] = ym.split("-").map(Number);
  const byDay = {};
  for (const t of arr("tasks")){ const h = horseOf(t); if (!h || (filter && !filter(t, h))) continue; (byDay[t.due] = byDay[t.due] || []).push(t); }
  const first = new Date(y, mo-1, 1), start = new Date(first); start.setDate(1 - first.getDay());
  let cells = "";
  for (let i = 0; i < 42; i++){
    const d = new Date(start); d.setDate(start.getDate() + i); if (i === 35 && d.getMonth() !== mo-1) break;
    const s = iso(d), ts = byDay[s] || [], open = ts.filter(t => !t.done), late = open.some(() => s < TODAY);
    cells += `<button class="mc ${d.getMonth()!==mo-1?"out":""} ${s===TODAY?"is-today":""} ${late?"late":""}" data-calgo="${s}" aria-label="${esc(long(s))}: ${ts.length} item${ts.length===1?"":"s"}"><span>${d.getDate()}</span><i class="mdots">${open.slice(0,3).map(t => `<b class="${t.cat}"></b>`).join("")}</i></button>`;
  }
  return `<div class="mcal-h"><b>${esc(first.toLocaleDateString(undefined,{month:"long", year:"numeric"}))}</b><span class="sp" style="flex:1"></span><button class="icon-btn sm" data-mcal="${key}:-1" aria-label="Previous month">${svg("left")}</button><button class="icon-btn sm" data-mcal="${key}:0" aria-label="This month" style="width:auto;padding:0 8px;font-size:12px;font-weight:700">Today</button><button class="icon-btn sm" data-mcal="${key}:1" aria-label="Next month">${svg("right")}</button></div>
    <div class="mcal">${["S","M","T","W","T","F","S"].map(x => `<span class="dw">${x}</span>`).join("")}${cells}</div>`;
}

function videoBlock(kind, id, o, canAdd){
  const vs = o.videos || [], add = canAdd !== false && canWrite && assets;

    ${vs.length ? vs.map((v, i) => `<figure class="vid"><video src="${esc(photoUrl(v))}" controls preload="metadata" playsinline></video>${add ? `<button class="btn link sm" data-vdel="${kind}:${id}:${i}">Remove video</button>` : ""}</figure>`).join("")
      : `<div class="vid-empty">${add ? "Add a clip: moving out, a sale video, a vet scan. MP4 or phone video, up to 20 MB (about 30 seconds)." : "No videos yet."}</div>`}</div>`;
}
document.addEventListener("change", async ev => {
  const inp = ev.target; if (!inp.dataset || !inp.dataset.videoAdd) return;
  const [kind, id] = inp.dataset.videoAdd.split(":"), c = COLL_OF[kind], f = inp.files && inp.files[0]; if (!f || !assets || !S[c][id]) return;
  if (f.size > 20 * 1024 * 1024){ toast("That clip is over 20 MB. Trim it to about 30 seconds."); return; }
  toast("Uploading video…");
  try {
    const type = f.type === "video/webm" ? "video/webm" : "video/mp4";
    const r = await assets.upload(f, {type});
    const o = S[c][id]; await put(c, id, {...o, videos:[...(o.videos || []), {id:r.id, type:r.contentType, name:f.name}].slice(0, 6)}); toast("Video added");
  } catch(e){ toast(e && e.code === "too_large" ? "That clip is over 20 MB. Trim it to about 30 seconds." : e && e.code === "unsupported_type" ? "Use an MP4 or WebM video." : "Couldn't upload the video. Try again."); }
});

    const [kind, id, i] = d.vdel.split(":"), c = COLL_OF[kind], o = S[c][id], v = (o.videos || [])[+i]; if (!v) return;
    await put(c, id, {...o, videos: o.videos.filter((_, j) => j !== +i)}); if (assets){ try { await assets.delete(v.id); } catch(_){} } toast("Video removed");
  }
});

let queue = [], flushing = false, offlineWarned = false;

async function flushQueue(){
  if (flushing || !queue.length || !sb || !barnId) return; flushing = true;
  try {
    while (queue.length){
      const op = queue[0].op, batch = []; while (queue.length && queue[0].op === op && batch.length < 300) batch.push(queue.shift());
      let res;
      if (op === "up"){ const m = new Map(); for (const x of batch) m.set(x.c + "\u0000" + x.id, {barn_id:barnId, coll:x.c, id:x.id, data:x.data, updated_at:new Date().toISOString(), updated_by:me.id}); res = await sb.from("docs").upsert([...m.values()]); }
      else { res = {error:null}; for (const x of batch){ const r = await sb.from("docs").delete().match({barn_id:barnId, coll:x.c, id:x.id}); if (r.error){ res = r; break; } } }
      if (res.error){
        if (isNetErr(res.error)){ queue = batch.concat(queue); qSave(); if (!offlineWarned){ offlineWarned = true; toast("Saved on this phone. It'll sync when you're back online."); } break; }
        if (res.error.code === "42501"){ canWrite = false; toast("You have view-only access to this barn"); render(); }
        else toast("Couldn't save a change: " + (res.error.message || "try again"));
      }

    }

}
function cloudWrite(op, c, id, data){

}

// ---------- v9: heat-cycle prediction ----------
// Mares cycle about every 21 days (ovulation to ovulation). Heat (estrus) lasts ~5–7 days and she
// usually ovulates near the end of it, so the next heat opens ~5 days before the predicted ovulation.
// Each mare's own cycle length is learned from her recorded ovulations.
const CYCLE_DEF = 21;
const PREG_KEYS = new Set(["d14","d25","d35","d45","d60"]);
const isPregCheck = id => PREG_KEYS.has(taskKey(id || ""));
const notPregnant = m => m.status === "open" || m.status === "foaled";
function follicleSignal(mareId){
  const ex = mareTasks(mareId).filter(t => isExam(t) && t.done && (t.lo || t.ro) && diff(TODAY, t.due) <= 3 && diff(TODAY, t.due) >= 0).sort((a,b) => b.due.localeCompare(a.due))[0];
  if (!ex || ex.ovulated) return null;
  const mm = [ex.lo, ex.ro].map(x => { const r = /(\d{2})\s*mm/i.exec(x || ""); return r ? +r[1] : 0; }), size = Math.max(...mm);
  if (size >= 35) return {k:"hot", size, date:ex.due, t:`${size} mm follicle ${short(ex.due)}`, s:"Ovulation likely within 24–48 hrs. Breed or have semen on the way now."};
  if (size >= 28) return {k:"warm", size, date:ex.due, t:`${size} mm follicle ${short(ex.due)}`, s:"Coming into heat. Recheck in 24–48 hrs."};
  return null;
}
function cycleInfo(m, id){
  const cyc = [...new Set([...(m.cycles || []), ...(m.ovulationDate ? [m.ovulationDate] : [])])].sort();
  const iv = []; for (let i = 1; i < cyc.length; i++){ const d = diff(cyc[i], cyc[i-1]); if (d >= 15 && d <= 30) iv.push(d); }
  const L = iv.length ? Math.round(iv.reduce((a,b) => a+b, 0) / iv.length) : CYCLE_DEF;
  let last = cyc[cyc.length - 1] || null, basis = "ovulation";
  // after foaling with no ovulation recorded since: foal heat ~day 9, then every cycle after
  if (m.foalDate && (!last || last < m.foalDate)){ last = addDays(m.foalDate, 9 - L); basis = "foaling"; }
  if (!last) return null;
  const inHeat = (m.teases || []).filter(x => x.r === "in").map(x => x.d).sort();
  let next = addDays(last, L); while (addDays(next, 3) < TODAY) next = addDays(next, L);
  // observed heat this cycle beats the estimate: ovulation ~4 days into heat
  const run = inHeat.filter(d => d > last && diff(TODAY, d) <= 8);
  if (run.length){ next = addDays(run[0], 4); if (next < TODAY) next = TODAY; basis = "teasing"; }

}

  const d = el.dataset;
  if ("close" in d){ close(); return; }
  if (d.go){ go(d.go); return; }
  if ("goStuds" in d){ go("studs"); return; }
  if (d.mare){ ui.mare = d.mare; ui.foal = null; ui.stud = null; render(); window.scrollTo(0,0); return; }
  if ("back" in d){ ui.mare = null; render(); return; }
  if (d.toggle){
    const t = S.tasks[d.toggle]; if (!t || !canWrite) return;
    const done = !t.done;
    await put("tasks", d.toggle, {...t, done, doneBy: done ? me.id : null, doneAt: done ? TODAY : null});
    if (done && t.auto && /_p_d45$/.test(d.toggle)){ const m = S.mares[t.mareId]; if (m && m.status === "bred"){ await put("mares", t.mareId, {...m, status:"in-foal"}); toast(m.name + " confirmed in foal"); return; } }
    if (done && !arr("expenses").some(e=>e.taskId===d.toggle)){ const tt = {...t, id:d.toggle}, pr = taskPrice(tt); toast("Done", pr ? "Log " + money(pr) : "Log a cost", () => expForm(null, taskPrefill(tt))); }
    return;
  }
  if (d.task){ isExam(S.tasks[d.task], d.task) && S.tasks[d.task].mareId ? examForm(d.task) : taskForm(d.task); return; }
  if (d.bf){ ui.barnFilter = d.bf; render(); return; }
  if (d.cal !== undefined){ const k = Number(d.cal);
    if (k === 0){ ui.calDay = TODAY; ui.calMonth = TODAY.slice(0,7); }
    else if (ui.calMode === "month"){ const [y,m] = ui.calMonth.split("-").map(Number); const n = new Date(y, m-1+k, 1); ui.calMonth = iso(n).slice(0,7); ui.calDay = ui.calMonth === TODAY.slice(0,7) ? TODAY : iso(n); }
    else { ui.calDay = addDays(ui.calDay, k * (ui.calMode === "week" ? 7 : 1)); ui.calMonth = ui.calDay.slice(0,7); }
    render(); return; }
  if (d.day){ ui.calDay = d.day; if (d.day.slice(0,7)!==ui.calMonth) ui.calMonth = d.day.slice(0,7); render(); return; }
  if (d.seg){ ui.studSeg = d.seg; render(); return; }
  if (d.stud){ ui.stud = d.stud; ui.mare = null; ui.foal = null; close(); render(); window.scrollTo(0,0); return; }
  if (d.adv){ const o = S.orders[d.adv]; const i = OSTEPS.indexOf(o.status); await put("orders", d.adv, {...o, status:OSTEPS[Math.min(3,i+1)]}); return; }
  if (d.cancel){ await del("orders", d.cancel); await del("tasks", d.cancel+"_breed"); await del("tasks", d.cancel+"_ship"); for (const e of arr("expenses")) if (e.orderId===d.cancel && e.status==="unpaid") await del("expenses", e.id); toast("Request cancelled"); return; }
  if (d.act === "add-mare") mareForm();
  else if (d.act === "edit-mare") mareForm(d.id);
  else if (d.act === "foaled") foalForm(d.id);
  else if (d.act === "add-task") taskForm(null, {mareId:d.id});
  else if (d.act === "add-exam") examForm(null, d.id);
  else if (d.act === "add-event") taskForm(null, null, ui.calDay);
  else if (d.act === "pick-mare") pickMareForStud(d.id);
  else if (d.act === "edit-stud") studForm(d.id);
  else if (d.act === "print-todo") printTodo();
  else if (d.act === "print-cal") printCal();
  else if (d.act === "reset-demo"){ try { localStorage.removeItem(DEMO_KEY); } catch(_){} await localAssets.clear(); for (const c of COLLS) S[c] = {}; await loadSample(); toast("Demo reset to the sample barn"); }
  else if (d.act === "add-stud") studForm();
  else if (d.act === "order"){ orderForm(d.id); }
  else if (d.act === "del-stud"){ close(); ui.stud = null; for (const t of studTasks(d.id)) await del("tasks", t.id); await del("studs", d.id); toast("Listing removed"); }
  else if (d.act === "load-sample"){ el.disabled = true; await loadSample(); }
  else if (d.act === "clear-sample"){ el.disabled = true; await clearSample(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "barnQ"){ ui.barnQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#barnQ"); n.focus(); n.setSelectionRange(pos,pos); }
  if (e.target.id === "studQ"){ ui.studQ = e.target.value; const pos = e.target.selectionStart; render(); const n = $("#studQ"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("change", e => { if (e.target.id === "studBreed"){ ui.studBreed = e.target.value; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape") close(); });

// ---------- boot ----------
$(".brand").innerHTML = logoSvg(); $("#footLogo").innerHTML = logoSvg(); $("#yr").textContent = TODAY.slice(0,4);
render();
(async () => {
  const c = window.claude;
  [db, user, assets, downloads, sampleFn] = c && c.use ? await Promise.all(["db","user","assets","downloads","sample"].map(n => c.use(n).catch(()=>null))) : [null, null, null, null, null];
  if (sampleFn){ try { const lim = await sampleFn.limits(); sampleImg = !!(lim && lim.images); } catch(_){ sampleImg = false; } }
  if (user){
    me = await user.me();
    if (me.avatarUrl){ $("#meAv").src = me.avatarUrl; $("#meAv").hidden = false; }
    const w = await user.can("data.write"); if (w === false) canWrite = false;
  }
  if (!c && CLOUD_ON){
    sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey, {auth:{storage:authStore, persistSession:true, autoRefreshToken:true, detectSessionInUrl:true, flowType:"pkce"}});
    CLOUD_MEDIA = CFG.supabaseUrl.replace(/\/$/, "") + "/storage/v1/object/public/media/";
    local = false; downloads = null;
    const fromLink = /[?&]code=/.test(location.search);
    if (!location.hash && !fromLink) ui.view = "landing";
    sb.auth.onAuthStateChange((evt) => { if (evt === "PASSWORD_RECOVERY") setTimeout(newPasswordSheet, 300); });
    let session = null; try { session = (await sb.auth.getSession()).data.session; } catch(_){}
    if (fromLink){ try { history.replaceState(null, "", location.pathname + (location.hash || "#today")); } catch(_){} if (session) ui.view = "today"; }
    if (session){ try { await enterCloud(session.user); } catch(e){ ready = true; render(); toast("Couldn't reach Marebook. Check your connection."); } }
    else { await loadListingsAnon(); ready = true; render(); }
    return;
  }
  if (!db){
    local = true; me = me.id ? me : {id:"local"};
    if (!location.hash) ui.view = "landing";
    try { await localAssets.loadAll(); assets = localAssets; } catch(_){}
    $("#banner").hidden = false; $("#banner").textContent = "Preview: changes, photos and videos save on this device only.";
    ready = true; if (!loadLocal()) await loadSample(true); render(); refreshHeat(); return;
  }
  let pending = COLLS.length;
  for (const coll of COLLS){
    db.collection(coll).onSnapshot(snap => {
      const o = {}; snap.docs.forEach(d => { o[d.id] = d.data(); });
      S[coll] = o;
      if (pending > 0 && --pending === 0){ ready = true; refreshHeat(); }
      if (ready){ render(); refreshProfiles(); }
    }, err => { if (err.code === "revoked"){ canWrite = false; render(); } });
  }
})();
})();
</script>
