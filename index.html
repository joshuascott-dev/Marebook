<style>
/* Layout: one-column phone app — sticky brand bar, scrolling view, fixed bottom tab bar; bottom sheets for forms. Widens to a centered 720px column on desktop. */
/* Brand: Marebook logo — night black, teal ring, silver lettering, blue orb; antique gold for luxury accents. */
:root{
  --bg:#f5f3ee; --surface:#ffffff; --sunk:#ece9e2; --ink:#111618; --muted:#5d666a; --line:#dfdad0;
  --accent:#1d6a6e; --accent-ink:#ffffff; --soft:#e2eeee;
  --brass:#8c6a2c; --brass-soft:#f3ecdc;
  --warn:#b4532a; --warn-soft:#f7e6dc; --danger:#a83232; --ok:#2f7a55;
  --night:#0a0e10; --night-2:#121a1d; --night-ink:#e8eced; --night-muted:#93a0a5; --night-line:#1f2c31;
  --silver:#c6cdd2; --ring:#2c8c8f; --orb:#2e93c4; --gold:#b8924c;
  --shadow:0 1px 2px rgb(16 22 24 / .04), 0 12px 32px -20px rgb(16 22 24 / .28);
  --f-display:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b0f11; --surface:#141a1d; --sunk:#0f1517; --ink:#e8ecee; --muted:#9aa5aa; --line:#243035;
  --accent:#5db6b8; --accent-ink:#061012; --soft:#12292b;
  --brass:#d3ae66; --brass-soft:#2a2416;
  --warn:#e8915e; --warn-soft:#2f2019; --danger:#e77272; --ok:#6fc596;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -20px rgb(0 0 0 / .6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0b0f11; --surface:#141a1d; --sunk:#0f1517; --ink:#e8ecee; --muted:#9aa5aa; --line:#243035;
  --accent:#5db6b8; --accent-ink:#061012; --soft:#12292b;
  --brass:#d3ae66; --brass-soft:#2a2416;
  --warn:#e8915e; --warn-soft:#2f2019; --danger:#e77272; --ok:#6fc596;
  --shadow:0 1px 2px rgb(0 0 0 / .3), 0 12px 32px -20px rgb(0 0 0 / .6); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;line-height:1.15}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:8px 28px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
.brand svg{width:24px;height:24px;color:var(--accent)}
.top .sp{flex:1}
.me{width:30px;height:30px;border-radius:50%;object-fit:cover;border:1px solid var(--line)}
.banner{max-width:720px;margin:10px auto 0;padding:8px 12px;border-radius:10px;background:var(--brass-soft);color:var(--ink);font-size:13px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.tab{background:none;border:0;padding:8px 0 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* sections */
.sec{display:grid;gap:10px;margin-top:22px}
.sec-h{display:flex;align-items:baseline;gap:8px}
.sec-h h2{font-size:19px}
.sec-h .sp{flex:1}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.hello{margin-top:18px}
.hello h1{font-size:28px}
.strip{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat{display:flex;align-items:baseline;gap:6px;padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px}
.stat b{font-family:var(--f-mono);font-size:14px}
.stat.alert{background:var(--warn-soft);border-color:transparent}
.stat.alert b{color:var(--warn)}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 0}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* lists */
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task .body{min-width:0;cursor:pointer}
.task .t{font-weight:600;line-height:1.3}
.task.done .t{text-decoration:line-through;color:var(--muted)}
.task .m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.chk{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.chk svg{width:14px;height:14px;opacity:0}
.chk[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk[aria-checked="true"] svg{opacity:1}
.due{font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.due.over{color:var(--warn);font-weight:700}
.due.today{color:var(--accent);font-weight:700}
.cat{display:inline-flex;align-items:center;gap:5px}
.cat i{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--muted)}
.c-vet i{background:var(--accent)} .c-vaccine i{background:var(--brass)} .c-foaling i{background:var(--warn)} .c-breeding i{background:var(--ok)}
.av{width:24px;height:24px;border-radius:50%;object-fit:cover}
.empty-row{padding:16px 14px;color:var(--muted);font-size:14px}

/* mare cards */
.mares{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.mare{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;text-align:left;width:100%}
.mare-h{display:flex;gap:8px;align-items:flex-start}
.mare-h h3{font-size:19px;flex:1;min-width:0}
.mare .sub{font-size:13px;color:var(--muted);margin-top:-6px}
.pill{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.in-foal{background:var(--soft);color:var(--accent)}
.pill.bred{background:var(--brass-soft);color:var(--brass)}
.pill.foaled{background:var(--warn-soft);color:var(--warn)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--brass);border:1px solid currentColor;border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.gest{display:grid;gap:5px}
.gest-bar{position:relative;height:8px;border-radius:4px;background:var(--sunk);overflow:visible}
.gest-bar span{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.gest-bar.watch span{background:var(--warn)}
.gest-bar em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--brass);left:94.1%}
.gest-l{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px}
.gest-l b{color:var(--ink);font-family:var(--f-mono)}
.next{font-size:13px;display:flex;gap:6px;align-items:baseline}
.next .due{margin-left:auto}

/* filters */
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;white-space:nowrap}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}

/* detail */
.back{display:inline-flex;align-items:center;gap:4px;margin-top:14px}
.detail-h{display:flex;gap:10px;align-items:flex-start;margin-top:6px}
.detail-h h1{font-size:30px;flex:1;min-width:0}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.fact{background:var(--surface);padding:10px 12px}
.fact dt{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.fact dd{margin:2px 0 0;font-weight:600}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;white-space:pre-wrap;font-size:14px}
.big-gest{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px}
.big-gest .d{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1}
.big-gest .d small{font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted)}

/* calendar */
.cal-h{display:flex;align-items:center;gap:8px;margin-top:16px}
.cal-h h1{font-size:24px;flex:1}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:10px}
.dow{font-size:11px;font-weight:700;text-align:center;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1.05;max-width:100%;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:4px;display:flex;flex-direction:column;align-items:flex-start;gap:3px;font-family:var(--f-mono);font-size:12px}
.day.out{opacity:.4}
.day.is-today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.day[aria-pressed="true"]{background:var(--soft)}
.dots{display:flex;flex-wrap:wrap;gap:2px}
.dots i{width:6px;height:6px;border-radius:2px;background:var(--muted)}
.dots i.vet{background:var(--accent)} .dots i.vaccine{background:var(--brass)} .dots i.foaling{background:var(--warn)} .dots i.breeding{background:var(--ok)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}

/* studs */
.seg{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:10px;padding:3px;margin-top:16px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.stud{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;text-align:left;width:100%}
.stud-h{display:flex;gap:10px;align-items:baseline}
.stud-h h3{font-size:19px;flex:1;min-width:0}
.fee{font-family:var(--f-mono);font-size:15px;font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:600}
.chip.ship{background:var(--soft);color:var(--accent)}
.order{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.step{font-size:11px;font-weight:700;color:var(--muted);display:grid;gap:4px}
.step i{height:4px;border-radius:2px;background:var(--sunk)}
.step.on{color:var(--accent)} .step.on i{background:var(--accent)}

/* team */
.person{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
.person:first-child{border-top:0}
.person img{width:36px;height:36px;border-radius:50%}
.person .n{font-weight:600;flex:1;min-width:0}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:14px;display:grid;gap:6px}
.howto ol{margin:0;padding-left:20px;display:grid;gap:4px}

/* welcome */
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:12px;margin-top:18px}
.welcome h2{font-size:24px}
.welcome p{margin:0;color:var(--muted);max-width:55ch}

/* sheet */
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:760px){.sheet{left:50%;right:auto;width:620px;transform:translateX(-50%)}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:22px;margin-bottom:12px}
.form{display:grid;gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.field textarea{min-height:80px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.two{grid-template-columns:1fr}}
.hint{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-wrap:wrap;gap:14px}
.checks label{display:flex;gap:6px;align-items:center;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink);font-weight:500}
.people-pick{display:grid;gap:4px;max-height:220px;overflow:auto}
.people-pick button{display:flex;align-items:center;gap:10px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);text-align:left}
.people-pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.confirm{background:var(--warn-soft);border-radius:10px;padding:10px 12px;display:grid;gap:8px;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:30}
.fab{position:fixed;right:max(16px,calc(50% - 344px));bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;border-radius:999px;padding:12px 18px;box-shadow:0 4px 14px rgb(0 0 0 / .18)}
/* spec additions */
.hlink{color:var(--accent);font-weight:600;cursor:pointer}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;align-items:center}
.quick select{flex:1 1 180px;width:auto;min-width:0}
.alert-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.alert-row:first-child{border-top:0}
.dotx{width:8px;height:8px;border-radius:50%;background:var(--accent)} .dotx.warn{background:var(--warn)}
.todo{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.todo-col{min-width:0;display:grid;gap:6px;align-content:start}
.todo-h{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:6px}
.todo-h span{font-family:var(--f-mono)}
.datein{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:13px;max-width:100%}
.thumbs{display:flex;gap:8px;overflow-x:auto;margin-top:12px;padding-bottom:2px}
.thumb{flex:0 0 auto;width:72px;height:72px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);padding:0;overflow:hidden;display:grid;place-items:center;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumbs.big .thumb{width:96px;height:96px}
.thumb.add{border-style:dashed;color:var(--muted);font-size:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;line-height:1;gap:2px}
.thumb.add span{font-size:11px;font-weight:600}
.cover{width:44px;height:44px;border-radius:10px;object-fit:cover;flex:0 0 auto;align-self:center}
.tbl.act th,.tbl.act td{text-align:left}
.tbl.act td{font-family:var(--f-body);font-weight:400;cursor:pointer}
.tbl.act td:first-child{font-family:var(--f-mono);font-weight:500}
.tbl.act tr.is-done td{color:var(--muted)}
.tbl.act tr.is-late td:first-child{color:var(--warn)}
.cal-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.day.has-late{box-shadow:inset 0 -3px 0 var(--warn)}
.dots i.dn{background:none!important;border:1.5px solid var(--muted)}
.week{display:grid;gap:12px;margin-top:12px}
.wk-day{display:grid;gap:6px}
.wk-h{font-size:13px;font-weight:700;color:var(--muted);cursor:pointer}
.wk-h b{font-family:var(--f-mono);color:var(--ink)}
.wk-day.is-today .wk-h,.wk-day.is-today .wk-h b{color:var(--accent)}
.howto span{display:block;color:var(--muted)}
.foot{max-width:720px;margin:0 auto;padding:20px 16px 120px;color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px 16px}
.foot b{font-family:var(--f-display);color:var(--ink);font-size:15px}
.tagline{font-size:13px;color:var(--muted)}
@media (max-width:520px){.tagline{display:none}}
/* v5: structure from Charles & Kelly's workbook */
.topnav{display:none}
.brand{cursor:pointer;background:none;border:0;padding:0;color:var(--ink)}
@media (min-width:900px){
  .topnav{display:flex;gap:2px;flex-wrap:wrap;margin-left:12px}
  .topnav button{border:0;background:none;padding:8px 10px;border-radius:8px;font-weight:600;font-size:13.5px;color:var(--muted)}
  .topnav button:hover{color:var(--ink)}
  .topnav button[aria-current="page"]{color:var(--ink);background:var(--soft)}
  .tabs{display:none}

async function put(c, id, data){
  if (cloud){ if (S[c][id] && S[c][id]._ext) { toast("That listing belongs to another barn"); return; } cloudWrite("up", c, id, data); return; }
  if (local || !db){ S[c][id] = data; saveLocal(); render(); return; }
  try { await db.collection(c).doc(id).set(data); }
  catch(e){ handleErr(e); }
}
async function patch(c, id, data){ const cur = S[c][id] || {}; return put(c, id, {...cur, ...data}); }
async function del(c, id){
  if (cloud){ if (S[c][id] && S[c][id]._ext) return; cloudWrite("del", c, id); return; }
  if (local || !db){ delete S[c][id]; saveLocal(); render(); return; }
  try { await db.collection(c).doc(id).delete(); } catch(e){ handleErr(e); }
}
function handleErr(e){
  if (e && e.code === "invalid_argument"){ canWrite = false; toast("You have view-only access to this barn"); render(); }
  else if (e && e.code === "quota_exceeded") toast("Storage is full. Delete old records to add more.");
  else toast("Couldn't save. Check your connection and try again.");
}
function toast(msg, action, fn){
  document.querySelectorAll(".toast").forEach(x => x.remove());
  const t = document.createElement("div"); t.className = "toast";
  const sp = document.createElement("span"); sp.textContent = msg; t.appendChild(sp);
  if (action){ const b = document.createElement("button"); b.type = "button"; b.textContent = action; b.onclick = () => { t.remove(); fn(); }; t.appendChild(b); }
  document.body.appendChild(t); setTimeout(() => t.remove(), action ? 6000 : 2600);
}

const anchor = m => m.ovulationDate || m.coverDate || "";
const carries = m => m.carry !== "no";

function gestDay(m){ const a = anchor(m); return (a && carries(m) && (m.status === "bred" || m.status === "in-foal")) ? diff(TODAY, a) : null; }
function dueDate(m){ const a = anchor(m); return a ? addDays(a, GEST) : null; }
function ageOf(m){ const y = parseInt(m.born, 10); return y > 1900 ? (+TODAY.slice(0,4) - y) : null; }
function horseOf(t){
  if (t.foalId) return S.foals[t.foalId] ? {kind:"foal", id:t.foalId, name:foalName(S.foals[t.foalId])} : null;
  if (t.studId) return S.studs[t.studId] ? {kind:"stallion", id:t.studId, name:S.studs[t.studId].name} : null;
  return S.mares[t.mareId] ? {kind:"mare", id:t.mareId, name:S.mares[t.mareId].name} : null;
}
const liveTask = t => !!horseOf(t);
const isExam = (t, id) => !!(t && (t.exam || EXAM_KEYS.has(taskKey(id || t.id))));
const openTasks = () => arr("tasks").filter(t => !t.done && liveTask(t)).sort((a,b) => a.due < b.due ? -1 : 1);
function mareTasks(id){ return arr("tasks").filter(t => t.mareId === id && !t.foalId && !t.studId).sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0); }
function foalTasks(id){ return arr("tasks").filter(t => t.foalId === id).sort((a,b) => a.due < b.due ? -1 : a.due > b.due ? 1 : 0); }
function studTasks(id){ return arr("tasks").filter(t => t.studId === id).sort((a,b) => a.due < b.due ? -1 : 1); }
const collDays = s => Array.isArray(s.collDays) ? s.collDays : [];
const collLabel = s => collDays(s).length ? collDays(s).map(i => WD[i]).join(" / ") : (s.days || "");
function nextCollections(s, n, from){
  const days = collDays(s); if (!days.length) return [];
  const out = []; let d = from || addDays(TODAY, 1);
  for (let i = 0; i < 28 && out.length < n; i++){ if (days.includes(parse(d).getDay())) out.push(d); d = addDays(d, 1); }
  return out;
}
const wdShort = s => WD[parse(s).getDay()] + " " + short(s);

async function genTasks(mareId, m, doneBefore){
  const jobs = [];
  const job = (id, p, due, extra) => {
    const ex = S.tasks[id]; if (ex && ex.done) return;
    const pre = !!(p.done || (doneBefore && due < doneBefore));
    jobs.push([id, {...(ex||{}), mareId, title:p.t, due, cat:p.c, auto:true, exam: !!p.exam, assignee: ex ? ex.assignee || null : null, done:pre, doneBy: pre ? me.id : null, doneAt: pre ? due : null, sample: !!m.sample, ...(extra||{})}]);
  };
  const a = anchor(m);
  if (a && carries(m) && (m.status === "bred" || m.status === "in-foal")) for (const p of PREG) job(mareId + "_p_" + p.k, p, addDays(a, p.d));
  if (isET(m) && m.ovulationDate) for (const p of ETS) job(mareId + "_e_" + p.k, p, addDays(m.ovulationDate, p.d));
  if (m.foalDate && m.status === "foaled") for (const p of POST){ if (p.carry && !carries(m)) continue; job(mareId + "_f_" + p.k, p, addDays(m.foalDate, p.d)); }
  for (const [id, d] of jobs) await put("tasks", id, d);
}
async function genFoalTasks(foalId, fo, doneBefore){
  if (!fo.foaledOn || fo.status === "lost") return;
  for (const p of FOALSKED){
    const id = foalId + "_c_" + p.k, ex = S.tasks[id]; if (ex && ex.done) continue;
    const due = addDays(fo.foaledOn, p.d), pre = !!(doneBefore && due < doneBefore);
    await put("tasks", id, {...(ex||{}), foalId, title:p.t, due, cat:p.c, auto:true, assignee: ex ? ex.assignee || null : null, done:pre, doneBy: pre ? me.id : null, doneAt: pre ? due : null, sample: !!fo.sample});
  }
}
// Stallion selected for a mare: line up the pre-breeding ultrasound with his collection days.
async function scheduleCollection(mareId, m, stud){
  const s = stud || S.studs[m.stallionId]; if (!s || m.ovulationDate) return null;
  if (!(m.status === "open" || m.status === "bred")) return null;
  const ci = cycleInfo(m); const nxt = ci && notPregnant(m) ? alignedCollection(s, ci.nextOv) : nextCollections(s, 1, addDays(TODAY, 1))[0]; if (!nxt) return null;
  const pb = S.tasks[mareId + "_x_prebreed"], br = S.tasks[mareId + "_x_breed"];
  if (!(pb && pb.done)) await put("tasks", mareId + "_x_prebreed", {...(pb||{}), mareId, title:`Ultrasound to time breeding · order for ${wdShort(nxt)} collection (${s.name})`, due:addDays(nxt, -1), cat:"vet", exam:true, auto:true, done:false, sample:!!m.sample});
  if (!(br && br.done)) await put("tasks", mareId + "_x_breed", {...(br||{}), mareId, title:`Semen arrives · breed (${s.name}, collected ${short(nxt)})`, due:addDays(nxt, 1), cat:"breeding", auto:true, done:false, sample:!!m.sample});
  return nxt;
}

function dueLabel(d){
  const n = diff(d, TODAY);
  if (n < 0) return `<span class="due over">${-n}d late</span>`;
  if (n === 0) return `<span class="due today">Today</span>`;
  if (n === 1) return `<span class="due">Tomorrow</span>`;
  return `<span class="due">${short(d)}</span>`;
}
function taskRow(t, showHorse=true){
  const h = horseOf(t), ex = isExam(t);
  const findings = ex && (t.lo || t.ro || t.tone || t.ovulated) ? [t.lo ? "L: "+t.lo : "", t.ro ? "R: "+t.ro : "", t.tone ? "Tone: "+t.tone : "", t.ovulated ? "Ovulated" : ""].filter(Boolean).join(" · ") : "";
  return `<div class="task ${t.done?"done":""}">
    <button class="chk" role="checkbox" aria-checked="${!!t.done}" aria-label="Mark done" data-toggle="${t.id}" ${canWrite?"":"disabled"}>${svg("check",3)}</button>
    <div class="body" data-task="${t.id}">
      <div class="t">${esc(t.title)}</div>
      <div class="m">${showHorse && h ? `<span class="hlink" data-open="${h.kind}:${h.id}">${h.kind==="foal"?"Foal · ":h.kind==="stallion"?"Stallion · ":""}${esc(h.name)}</span>`:""}<span class="cat c-${t.cat}"><i></i>${CATS[t.cat]||"Care"}</span>${findings?`<span>${esc(findings)}</span>`:""}${t.assignee?`<span>→ ${esc(pname(t.assignee))}</span>`:""}${t.done&&t.doneBy?`<span>✓ ${esc(pname(t.doneBy))}</span>`:""}</div>
    </div>
    ${t.done ? `<span class="due">${t.doneAt?short(t.doneAt):""}</span>` : dueLabel(t.due)}
  </div>`;
}
function gestBar(m, compact){
  const g = gestDay(m); if (g == null) return "";
  const pct = Math.max(0, Math.min(100, g / GEST * 100)), watch = g >= 320;
  return `<div class="gest">
    <div class="gest-bar ${watch?"watch":""}" role="img" aria-label="Day ${g} of ${GEST}"><span style="width:${pct}%"></span><em title="Day 320 · foaling watch"></em></div>
    <div class="gest-l"><span>Day <b>${g}</b> of ~${GEST}</span><span>Due <b>${short(dueDate(m))}</b>${compact?"":" · "+(GEST-g>0?(GEST-g)+" days":"overdue "+(g-GEST)+"d")}</span></div>
  </div>`;
}
function mareCard(id){

function calMain(){
  const mode = ui.calMode, byDay = calItems();
  const [y, mo] = ui.calMonth.split("-").map(Number);
  const head = mode === "month" ? new Date(y, mo-1, 1).toLocaleDateString(undefined,{month:"long",year:"numeric"})
    : mode === "week" ? (() => { const s = addDays(ui.calDay, -parse(ui.calDay).getDay()); return "Week of " + short(s); })() : long(ui.calDay);
  const ctrls = `<div class="cal-tools"><div class="seg" style="margin:0">${[["day","Day"],["week","Week"],["month","Month"]].map(([k,v]) => `<button data-cm="${k}" aria-pressed="${mode===k}">${v}</button>`).join("")}</div>
    <select class="search" id="calFilter" aria-label="Filter" style="width:auto">${[["all","All horses"],["mare","Mares"],["foal","Foals"],["stallion","Stallions"]].map(([k,v]) => `<option value="${k}" ${ui.calFilter===k?"selected":""}>${v}</option>`).join("")}</select>
    ${canWrite?`<button class="btn sm" data-act="add-event">+ Event</button>`:""}<button class="btn sm" data-act="print-cal">${PRINT_L()}</button></div>`;
  const nav = `<div class="cal-h"><h1>${esc(head)}</h1><button class="icon-btn" data-cal="-1" aria-label="Previous">${svg("left")}</button><button class="btn sm" data-cal="0">Today</button><button class="icon-btn" data-cal="1" aria-label="Next">${svg("right")}</button></div>`;
  const legend = `<div class="legend">${Object.entries(CATS).map(([k,v])=>`<span class="cat c-${k}"><i></i>${v}</span>`).join("")}<span class="cat"><i style="background:var(--warn);border-radius:50%"></i>Overdue</span><span class="cat"><i style="background:none;border:1.5px solid var(--muted)"></i>Done</span></div>`;
  const sortT = l => (l||[]).slice().sort((a,b) => (a.done?1:0)-(b.done?1:0));
  if (mode === "month"){
    const first = new Date(y, mo-1, 1), start = new Date(first); start.setDate(1 - first.getDay());
    let cells = "";
    for (let i = 0; i < 42; i++){
      const d = new Date(start); d.setDate(start.getDate()+i); const s = iso(d);
      if (i === 35 && d.getMonth() !== mo-1) break;
      const ts = byDay[s] || [], late = ts.some(t => !t.done && s < TODAY);
      cells += `<button class="day ${d.getMonth()!==mo-1?"out":""} ${s===TODAY?"is-today":""} ${late?"has-late":""}" data-day="${s}" aria-pressed="${s===ui.calDay}" aria-label="${short(s)}, ${ts.length} items">${d.getDate()}<span class="dots">${ts.slice(0,6).map(t=>`<i class="${t.cat} ${t.done?"dn":""}"></i>`).join("")}</span></button>`;
    }
    return `${nav}${ctrls}<div class="cal">${["S","M","T","W","T","F","S"].map(d=>`<div class="dow">${d}</div>`).join("")}${cells}</div>${legend}
    <section class="sec"><div class="sec-h"><h2>${esc(long(ui.calDay))}</h2></div><div class="list">${(byDay[ui.calDay]||[]).length ? sortT(byDay[ui.calDay]).map(t=>taskRow(t)).join("") : `<div class="empty-row">Nothing scheduled.</div>`}</div></section>`;
  }
  if (mode === "week"){
    const s0 = addDays(ui.calDay, -parse(ui.calDay).getDay());
    return `${nav}${ctrls}${legend}<div class="week">${[0,1,2,3,4,5,6].map(i => { const s = addDays(s0, i), ts = sortT(byDay[s]);
      return `<section class="wk-day ${s===TODAY?"is-today":""}"><div class="wk-h" data-day="${s}" data-cm-day>${WD[i]} <b>${parse(s).getDate()}</b></div><div class="list">${ts.length ? ts.map(t=>taskRow(t)).join("") : `<div class="empty-row">—</div>`}</div></section>`; }).join("")}</div>`;
  }
  const ts = sortT(byDay[ui.calDay]), late = ui.calDay === TODAY ? openTasks().filter(t => t.due < TODAY && (ui.calFilter==="all" || horseOf(t).kind===ui.calFilter)) : [];
  return `${nav}${ctrls}${legend}
    ${late.length ? `<section class="sec"><div class="sec-h"><h2>Overdue</h2></div><div class="list">${late.map(t=>taskRow(t)).join("")}</div></section>` : ""}
    <section class="sec"><div class="sec-h"><h2>${ui.calDay===TODAY?"Today":esc(short(ui.calDay))}</h2></div><div class="list">${ts.length ? ts.map(t=>taskRow(t)).join("") : `<div class="empty-row">Nothing scheduled.</div>`}</div></section>`;
}

  const life = entries("all", id), lifeExp = life.filter(isExp), y = sum(entries("ytd", id).filter(isExp), id);
  const lifeInc = sum(life.filter(e=>!isExp(e)), id);
  const k = pc
    ? kpi("This pregnancy", money(pc.spent,false), `${money(pc.direct,false)} direct + ${money(pc.overhead,false)} barn share`) + kpi("Still ahead", money(pc.ahead+pc.upkeep,false), `${money(pc.ahead,false)} checklist + ${money(pc.upkeep,false)} upkeep`) + kpi("Est. cost of this foal", money(pc.total,false), "through foaling day", "warn")
    : kpi("This year", money(y,false), "direct costs") + kpi("Lifetime", money(sum(lifeExp,id),false), lifeExp.length+" entries") + kpi("Income", money(lifeInc,false), "foal sales, leases", lifeInc?"good":"");
  const recent = life.sort((a,b) => b.date.localeCompare(a.date)).slice(0,6);
  return `<section class="sec"><div class="sec-h"><h2>Costs</h2><span class="sp"></span>${canWrite?`<button class="btn sm" data-cact="add-exp" data-mare-id="${id}">+ Cost</button><button class="btn sm" data-cact="add-inc" data-mare-id="${id}">+ Income</button>`:""}</div>
    <div class="kpis">${k}</div>
    ${m.budget ? `<div><div class="gest-l"><span>Season budget</span><span><b>${money(y,false)}</b> of ${money(m.budget,false)}${y>m.budget?` · <span style="color:var(--warn)">${money(y-m.budget,false)} over</span>`:""}</span></div>${budgetBar(y, m.budget)}</div>` : ""}
    ${lifeExp.length ? hbars(lifeExp, id, 6) : ""}
    <div class="list">${recent.length ? recent.map(e => entRow(e, id)).join("") : `<div class="empty-row">No costs logged for ${esc(m.name)} yet. Tick off a checklist item to log its cost in one tap.</div>`}</div>
    ${life.length > 6 ? `<button class="btn link" data-cact="mare-ledger" data-mare-id="${id}">All ${life.length} entries in Costs</button>` : ""}
  </section>`;
}
function owedSection(){
  const owed = {}; for (const e of arr("expenses")) if (isExp(e) && e.reimburse && !e.reimbursed && e.paidBy) owed[e.paidBy] = (owed[e.paidBy]||0) + (Number(e.amount)||0);
  const ids = Object.keys(owed); if (!ids.length) return "";
  return `<section class="sec"><div class="sec-h"><h2>Owed back to the team</h2></div><div class="list">${ids.map(id => `<div class="person"><img src="${esc(pav(id))}" alt=""><span class="n">${esc(pname(id))}</span><span class="money">${money(owed[id])}</span>${canWrite?`<button class="btn sm" data-reimb="${esc(id)}">Mark repaid</button>`:""}</div>`).join("")}</div></section>`;
}
function viewCosts(){
  const p = ui.costPeriod, f = ui.costMare, mares = arr("mares").sort((a,b)=>a.name.localeCompare(b.name));
  if (f && f !== "barn" && !S.mares[f]) ui.costMare = "";
  const ents = entries(p, f), exp = ents.filter(isExp), inc = ents.filter(e => !isExp(e));
  const spent = sum(exp, f), income = sum(inc, f);
  const oh = isMareF(f) ? overheadShare(p) : 0;
  const unpaid = arr("expenses").filter(e => isExp(e) && e.status === "unpaid" && onMare(e, f)).sort((a,b) => (a.dueDate||a.date).localeCompare(b.dueDate||b.date));
  const unpaidAmt = sum(unpaid, f), proj = projected(90, f);
  const net = income - spent - oh;
  const buckets = BUCKETS.map(b => [b, exp.filter(e => bucketOf(e) === b).reduce((s,e)=>s+share(e,f),0)]);
  const q = ui.costQ.toLowerCase();
  const list = ents.filter(e => !q || [e.title, e.vendor, catLabel(e), e.notes].join(" ").toLowerCase().includes(q)).sort((a,b) => b.date.localeCompare(a.date) || (b.createdAt||"").localeCompare(a.createdAt||""));
  const shown = ui.costMore ? list : list.slice(0, 25);
  const recurring = arr("recurring").filter(r => onMare(r, f));
  const month = TODAY.slice(0,7), monthName = MON[+month.slice(5)-1];

  // by mare
  let table = "";
  if (!f && mares.length){
    const ohs = overheadShare(p);
    const [pa, pb] = range(p);
    const foalRev = id => arr("foals").filter(fo => fo.damId === id && fo.status === "sold" && fo.soldOn >= pa && fo.soldOn <= pb).reduce((s,fo) => s + foalPL(fo.id).revenue, 0);
    const rows = mares.map(m => { const e = entries(p, m.id); const d = sum(e.filter(isExp), m.id), i = sum(e.filter(x=>!isExp(x)), m.id) + foalRev(m.id); const ytd = sum(entries("ytd", m.id).filter(isExp), m.id); return {m, d, i, tot: d + ohs, net: i - d - ohs, ytd}; }).sort((a,b) => b.tot - a.tot);
    const T = rows.reduce((s,r) => ({d:s.d+r.d, i:s.i+r.i, tot:s.tot+r.tot, net:s.net+r.net}), {d:0,i:0,tot:0,net:0});
    table = `<section class="sec"><div class="sec-h"><h2>By mare</h2><span class="eyebrow">Overhead split ${mares.length} ways</span></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mare</th><th>Direct</th><th>Overhead</th><th>Total</th><th>Income + foal sales</th><th>Net</th><th>Budget (yr)</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td data-mare="${r.m.id}">${esc(r.m.name)}</td><td>${money(r.d,false)}</td><td>${money(ohs,false)}</td><td>${money(r.tot,false)}</td><td>${r.i?money(r.i,false):"—"}</td><td class="${r.net<0?"neg":"pos"}">${money(r.net,false)}</td><td>${r.m.budget?`${Math.round(r.ytd/r.m.budget*100)}%${budgetBar(r.ytd, r.m.budget)}`:"—"}</td></tr>`).join("")}
    <tr class="tot"><td>All mares</td><td>${money(T.d,false)}</td><td>${money(ohs*mares.length,false)}</td><td>${money(T.tot,false)}</td><td>${money(T.i,false)}</td><td class="${T.net<0?"neg":"pos"}">${money(T.net,false)}</td><td></td></tr>
    </tbody></table></div></section>`;
  }

  return `${pageBar("Costs & profit", crumb("account","Account"))}
  <div class="sec" style="margin-top:12px">
    <div class="filters">${Object.entries(PERIODS).map(([k,v]) => `<button class="fchip" data-cp="${k}" aria-pressed="${p===k}">${v}</button>`).join("")}</div>
    <select class="search" id="costMare" aria-label="Show costs for"><option value="">Whole operation</option><option value="barn" ${f==="barn"?"selected":""}>Barn overhead only</option><option value="foals" ${f==="foals"?"selected":""}>Foals (raising & sale)</option>${mares.map(m => `<option value="${m.id}" ${f===m.id?"selected":""}>${esc(m.name)}</option>`).join("")}</select>
  </div>
  <section class="sec"><div class="kpis">
    ${kpi("Spent · "+PERIODS[p].toLowerCase(), money(spent,false), `${exp.length} entries${!f&&arr("mares").length?` · ${money(spent/mareCount(),false)} per mare`:""}`)}
    ${isMareF(f) ? kpi("Barn overhead share", money(oh,false), "hay, feed, facility ÷ "+mareCount()) : ""}
    ${kpi("Unpaid bills", money(unpaidAmt,false), unpaid.length+" open", unpaid.length?"warn":"")}
    ${kpi("Next 90 days", money(proj.total,false), `${money(proj.tasks,false)} checklist · ${money(proj.rec,false)} recurring`)}
    ${kpi("Income", money(income,false), inc.length+" entries", income?"good":"")}
    ${kpi("Net", money(net,false), isMareF(f)?"after overhead share":"income − spending", net<0?"warn":"good")}
  </div></section>
  ${canWrite ? `<div class="row-btns" style="margin-top:12px"><button class="btn primary" data-cact="add-exp" data-mare-id="${isMareF(f)?f:""}">+ Log cost</button><button class="btn" data-cact="add-inc" data-mare-id="${isMareF(f)?f:""}">+ Income</button><button class="btn" data-cact="prices">Prices</button>${true?`<button class="btn" data-cact="export">Export CSV</button>`:""}</div>` : ""}

  ${unpaid.length ? `<section class="sec"><div class="sec-h"><h2>Bills to pay</h2><span class="sp"></span><span class="money">${money(unpaidAmt)}</span></div>
    <div class="list">${unpaid.map(e => `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-top:1px solid var(--line)">${entRow(e, f).replace('class="ent"','class="ent" style="border-top:0"')}${canWrite?`<button class="btn sm" style="margin-right:12px" data-pay="${e.id}">Paid</button>`:""}</div>`).join("").replace('border-top:1px solid var(--line)"','"')}</div></section>` : ""}

  <section class="sec"><div class="sec-h"><h2>Where it goes</h2></div>
    <div class="buckets">${buckets.map(([b,v]) => `<span>${b} <b>${money(v,false)}</b></span>`).join("")}</div>
    ${hbars(exp, f, 10)}</section>
  <section class="sec"><div class="sec-h"><h2>By month</h2><span class="eyebrow">${p==="ytd"?TODAY.slice(0,4):p==="last"?(+TODAY.slice(0,4)-1):"Last 12 months"}</span></div>${monthChart(exp, f, p)}</section>
  ${inc.length ? `<section class="sec"><div class="sec-h"><h2>Income</h2></div>${hbars(inc, f)}</section>` : ""}
  ${!f || f === "foals" ? profitSection(p) : ""}
  ${table}
  ${owedSection()}
  <section class="sec"><div class="sec-h"><h2>Recurring</h2><span class="sp"></span>${canWrite?`<button class="btn sm" data-cact="add-rec">+ Recurring</button>`:""}</div>
    <div class="list">${recurring.length ? recurring.map(r => { const posted = arr("expenses").some(e => e.recurringId === r.id && e.date.slice(0,7) === month); const ids = r.mareIds||[];
      return `<div class="ent" style="cursor:default"><div class="dt">MO<b>↻</b></div><div style="min-width:0"><div class="t" data-rec="${r.id}" style="cursor:pointer">${esc(r.title)}</div><div class="m"><span>${esc(catLabel(r))}</span><span>${ids.length?esc(ids.map(i=>S.mares[i]?S.mares[i].name:"").filter(Boolean).join(", ")):"Barn overhead"}</span>${r.vendor?`<span>${esc(r.vendor)}</span>`:""}</div></div>
      <div style="display:grid;gap:4px;justify-items:end"><span class="a">${money(share(r,f))}/mo</span>${canWrite?(posted?`<span class="hint">${monthName} posted</span>`:`<button class="btn sm" data-post="${r.id}">Post ${monthName}</button>`):""}</div></div>`; }).join("") : `<div class="empty-row">Monthly hay, feed, board or insurance. Post each month in one tap.</div>`}</div></section>
  <section class="sec"><div class="sec-h"><h2>Entries</h2><span class="sp"></span><span class="muted" style="font-size:13px">${list.length}</span></div>
    <input class="search" id="costQ" type="search" placeholder="Search description, vendor, category" value="${esc(ui.costQ)}">
    <div class="list">${shown.length ? shown.map(e => entRow(e, f)).join("") : `<div class="empty-row">${arr("expenses").length?"Nothing matches.":"No costs yet. Log your first one, or tick off a checklist item and log its cost from there."}</div>`}</div>
    ${list.length > shown.length ? `<button class="btn link" data-cact="more">Show all ${list.length}</button>` : ""}
  </section>`;
}

// ---------- cost forms ----------
function marePick(sel){
  const ms = arr("mares").sort((a,b)=>a.name.localeCompare(b.name));
  if (!ms.length) return `<div class="hint">No mares yet: this will count as barn overhead.</div>`;
  return `<div class="mare-pick">${ms.map(m => `<label><input type="checkbox" name="mare" value="${m.id}" ${sel.includes(m.id)?"checked":""}> ${esc(m.name)}</label>`).join("")}</div>`;
}
function knownPeople(){ const s = new Set(Object.keys(profiles)); if (me.id) s.add(me.id); for (const e of arr("expenses")) e.paidBy && s.add(e.paidBy); return [...s]; }
function expForm(eid, pre){

  <form class="form" id="ef">
    ${eid ? "" : `<div class="kindseg"><button type="button" data-kind="expense" aria-pressed="${!inc}">Cost</button><button type="button" data-kind="income" aria-pressed="${inc}">Income</button></div>`}
    <div class="field"><label for="e-title">${inc?"What came in":"What was it"}</label><input id="e-title" name="title" value="${esc(e.title)}" placeholder="${inc?"2025 sorrel filly sold":"Ultrasound + oxytocin"}"></div>
    <div class="two"><div class="field"><label for="e-amt">Amount ($)</label><input id="e-amt" name="amount" inputmode="decimal" required value="${esc(e.amount)}" placeholder="0.00"></div>

    <div class="field"><label for="e-cat">Category</label><select id="e-cat" name="cat">${inc ? Object.entries(INC).map(([k,v]) => `<option value="${k}" ${e.cat===k?"selected":""}>${v}</option>`).join("") : BUCKETS.map(b => `<optgroup label="${b}">${Object.entries(EXP).filter(([,v])=>v[1]===b).map(([k,v]) => `<option value="${k}" ${e.cat===k?"selected":""}>${v[0]}</option>`).join("")}</optgroup>`).join("")}</select></div>
    <div class="field"><label for="e-vendor">${inc?"From":"Paid to"}</label><input id="e-vendor" name="vendor" list="vendors" value="${esc(e.vendor)}" placeholder="${inc?"Buyer or lessee":"Vet clinic, feed store, ranch"}"><datalist id="vendors">${vendors.map(v=>`<option value="${esc(v)}">`).join("")}</datalist></div>
    ${arr("foals").length ? `<div class="field"><label for="e-foal">Foal</label><select id="e-foal" name="foalId"><option value="">Not a foal cost</option>${arr("foals").filter(x => x.status !== "sold" || x.id === e.foalId || !isExp(e)).sort((a,b)=>(b.foaledOn||"").localeCompare(a.foaledOn||"")).map(x => `<option value="${x.id}" ${e.foalId===x.id?"selected":""}>${esc(foalName(x))}</option>`).join("")}</select></div>` : ""}
    <div class="field" id="mareField" ${e.foalId?"hidden":""}><label>${inc?"Credit to":"Charge to"}</label>${marePick(e.mareIds||[])}<div class="hint" id="splitHint"></div></div>
    ${inc ? "" : `<div class="two"><div class="field"><label for="e-status">Status</label><select id="e-status" name="status"><option value="paid" ${e.status!=="unpaid"?"selected":""}>Paid</option><option value="unpaid" ${e.status==="unpaid"?"selected":""}>Unpaid bill</option></select></div>
      <div class="field"><label for="e-due">Due date (unpaid)</label><input id="e-due" name="dueDate" type="date" value="${esc(e.dueDate||"")}"></div></div>
    <div class="two"><div class="field"><label for="e-method">Method</label><select id="e-method" name="method"><option value=""></option>${METHODS.map(x=>`<option ${e.method===x?"selected":""}>${x}</option>`).join("")}</select></div>

    ${e.receipt ? `<div class="receipt">${/^image\//.test(e.receipt.type||"") ? `<img src="/_blob/${esc(e.receipt.id)}" alt="Receipt">` : `<a href="/_blob/${esc(e.receipt.id)}" target="_blank" rel="noopener">${esc(e.receipt.name||"Receipt")}</a>`}<label><input type="checkbox" name="dropReceipt"> Remove</label></div>` : ""}

    <div class="field"><label for="e-notes">Notes</label><textarea id="e-notes" name="notes" placeholder="Invoice #, drug lot, what was done">${esc(e.notes)}</textarea></div>

  </form>`, root => {
    const f = root.querySelector("#ef");
    const sb = root.querySelector("#scanBtn"); sb && sb.addEventListener("click", () => scanReceipt(root));
    const fsel = f.querySelector('[name="foalId"]');
    fsel && fsel.addEventListener("change", () => { root.querySelector("#mareField").hidden = !!fsel.value; });
    const read = () => ({...e, foalId: fsel ? fsel.value : (e.foalId||""), title:val(f,"title"), amount:val(f,"amount"), date:val(f,"date"), cat:val(f,"cat"), vendor:val(f,"vendor"), notes:val(f,"notes"), mareIds:[...f.querySelectorAll('[name="mare"]:checked')].map(x=>x.value),
      ...(f.querySelector('[name="status"]') ? {status:val(f,"status"), dueDate:val(f,"dueDate"), method:val(f,"method"), paidBy:val(f,"paidBy")||me.id, reimburse:f.querySelector('[name="reimburse"]').checked, reimbursed: !!(f.querySelector('[name="reimbursed"]')||{}).checked} : {})});
    const hint = () => { const n = f.querySelectorAll('[name="mare"]:checked').length, a = num(val(f,"amount")), h = root.querySelector("#splitHint");
      h.textContent = !n ? (inc ? "Nothing checked: counts as operation income." : "Nothing checked: counts as barn overhead, shared across all mares in reports.") : n === 1 ? "" : `Split evenly: ${money(a/n,true)} each across ${n} mares.`; };

      const d = read(); d.amount = num(d.amount); if (d.foalId) d.mareIds = []; else delete d.foalId;
      if (!d.amount){ toast("Enter an amount"); return; }
      if (!d.title) d.title = catLabel(d);
      if (d.status === "paid"){ d.dueDate = ""; if (!d.paidDate) d.paidDate = d.date; }
      if (!eid){ d.createdBy = me.id; d.createdAt = new Date().toISOString(); }
      const drop = f.querySelector('[name="dropReceipt"]'), file = f.querySelector('[name="file"]');
      const old = e.receipt;

      if (file && file.files[0] && assets){

        catch(err){ toast(err && err.code === "too_large" ? "Receipt is over 20 MB. Save the entry, then try a smaller photo." : "Couldn't upload the receipt. The entry was saved without it."); }
      }
      close(); const nid = eid || uid();
      await put("expenses", nid, d);
      if (old && (!d.receipt || d.receipt.id !== old.id) && assets){ try { await assets.delete(old.id); } catch(_){} }
      toast(eid ? "Saved" : (d.kind==="income" ? "Income logged · " : "Logged · ") + money(d.amount));
    });
    const dx = root.querySelector("#delExp");
    dx && dx.addEventListener("click", () => {
      root.querySelector("#delExpBox").innerHTML = `<div class="confirm">Delete this ${money(e.amount)} entry${e.receipt?" and its receipt":""}? This can't be undone.<div class="row-btns"><button class="btn danger sm" type="button" id="dxYes">Delete entry</button><button class="btn sm" type="button" id="dxNo">Keep</button></div></div>`;
      root.querySelector("#dxNo").onclick = () => root.querySelector("#delExpBox").innerHTML = "";
      root.querySelector("#dxYes").onclick = async () => { close(); await del("expenses", eid); if (e.receipt && assets){ try { await assets.delete(e.receipt.id); } catch(_){} } toast("Entry deleted"); };
    });
  });
}

function pricesForm(){
  const pr = prices();
  const row = p => `<div class="pr"><label for="pp-${p.k}" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500">${esc(p.t)} <span class="muted" style="font-size:12px">${POST.includes(p)?"foaling day "+p.d:FOALSKED.includes(p)?"age "+p.d+" days":p.k==="prebreed"?"before collection":"day "+p.d}</span></label><input id="pp-${p.k}" name="${p.k}" inputmode="decimal" value="${pr[p.k]??""}"></div>`;
  sheet(`<h2>Your barn's prices</h2><p class="hint" style="margin-top:-6px">What each checklist step usually costs you. Used for one-tap logging and projections. Defaults are rough North Texas figures; set your vet's.</p>
  <form class="form" id="pf"><div class="eyebrow">Breeding & pregnancy</div><div class="prices">${[{k:"prebreed",d:-1,t:"Pre-breeding ultrasound"}, ...ETS, ...PREG].map(row).join("")}</div><div class="eyebrow">Mare after foaling</div><div class="prices">${POST.filter(p=>!p.done).map(row).join("")}</div><div class="eyebrow">Foal care</div><div class="prices">${FOALSKED.map(row).join("")}</div>
  <div class="eyebrow">Foals</div><div class="prices"><div class="pr"><label for="pp-foalKeep" style="text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink);font-weight:500">Keep per foal per month <span class="muted" style="font-size:12px">feed, hay, board</span></label><input id="pp-foalKeep" name="foalKeep" inputmode="decimal" value="${pr.foalKeep??""}"></div></div>
  <div class="row-btns"><button class="btn primary" type="submit" ${canWrite?"":"disabled"}>Save prices</button><button class="btn" type="button" data-close>Cancel</button><button class="btn" type="button" id="resetP">Reset to defaults</button></div></form>`, root => {
    const f = root.querySelector("#pf");
    root.querySelector("#resetP").onclick = () => { for (const [k,v] of Object.entries(DEF_PRICES)){ const i = f.querySelector(`[name="${k}"]`); if (i) i.value = v; } };
    f.addEventListener("submit", async ev => { ev.preventDefault(); const out = {}; for (const k of Object.keys(DEF_PRICES)) out[k] = num(val(f,k)); close(); await put("settings", "prices", {prices: out, updatedBy: me.id}); toast("Prices saved"); });
  });
}
async function exportCsv(){
  const f = ui.costMare, rows = entries(ui.costPeriod, f).sort((a,b) => a.date.localeCompare(b.date));
  const q = v => { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s; };
  const head = ["Date","Type","Description","Category","Group","Amount","Share for filter","Charged to","Vendor","Status","Due","Method","Paid by","Owed back","Repaid","Notes"];
  const lines = [head.join(",")].concat(rows.map(e => [e.date, isExp(e)?"Cost":"Income", e.title, catLabel(e), isExp(e)?bucketOf(e):"Income", (Number(e.amount)||0).toFixed(2), share(e,f).toFixed(2),
    e.foalId ? "Foal: " + (S.foals[e.foalId] ? foalName(S.foals[e.foalId]) : "") : (e.mareIds||[]).length ? e.mareIds.map(i => S.mares[i] ? S.mares[i].name : "").join("; ") : "Barn overhead", e.vendor, e.status||"", e.dueDate||"", e.method||"", pname(e.paidBy), e.reimburse?"yes":"", e.reimbursed?"yes":"", e.notes].map(q).join(",")));
  const label = (f === "barn" ? "overhead" : f && S.mares[f] ? S.mares[f].name.replace(/[^\w]+/g,"-").toLowerCase() : "all") + "-" + ui.costPeriod;
  await saveFile(`marebook-costs-${label}.csv`, lines.join("\n"), "text/csv");
}

document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-cp],[data-exp],[data-pay],[data-reimb],[data-post],[data-rec],[data-cact]"); if (!el) return;
  const d = el.dataset;
  if (d.cp){ ui.costPeriod = d.cp; ui.costMore = false; render(); return; }
  if (d.exp){ expForm(d.exp); return; }
  if (d.rec){ recForm(d.rec); return; }
  if (d.pay){ const e = S.expenses[d.pay]; if (e) { await put("expenses", d.pay, {...e, status:"paid", paidDate:TODAY, dueDate:""}); toast("Marked paid · " + money(e.amount)); } return; }
  if (d.reimb){ let t = 0; for (const e of arr("expenses")) if (e.paidBy === d.reimb && e.reimburse && !e.reimbursed){ t += Number(e.amount)||0; const {id, ...body} = e; await put("expenses", id, {...body, reimbursed:true, reimbursedOn:TODAY}); } toast(money(t) + " marked repaid"); return; }
  if (d.post){ const r = S.recurring[d.post]; if (!r) return; await put("expenses", uid(), {kind:"expense", title:r.title, cat:r.cat, amount:Number(r.amount)||0, mareIds:r.mareIds||[], vendor:r.vendor||"", date:TODAY, status:"paid", method:"", paidBy:me.id, recurringId:d.post, sample:!!r.sample, createdBy:me.id, createdAt:new Date().toISOString()}); toast("Posted · " + money(r.amount)); return; }
  const a = d.cact, mid = d.mareId;
  if (a === "add-exp") expForm(null, {kind:"expense", mareIds: mid ? [mid] : []});
  else if (a === "add-inc") expForm(null, {kind:"income", cat:"foalsale", mareIds: mid ? [mid] : []});
  else if (a === "add-rec") recForm();
  else if (a === "prices") pricesForm();
  else if (a === "export") exportCsv();
  else if (a === "more"){ ui.costMore = true; render(); }
  else if (a === "mare-ledger"){ ui.costMare = mid; ui.costPeriod = "all"; go("costs"); }
});

// ---------- foals ----------
const SALE_CATS = ["commission","marketing"];
const FSTATUS = {raising:"On the ground", listed:"For sale", sold:"Sold", kept:"Kept", lost:"Lost"};
const SALE_TYPES = ["Private treaty","Online auction","Live sale / consignment","Sold in utero","Other"];
const yrs = s => s ? parse(s).getFullYear() : "";
function ageLabel(s){ if (!s) return ""; const d = diff(TODAY, s); if (d < 0) return ""; if (d < 60) return d+" days"; const mo = Math.floor(d/30.44); return mo < 24 ? mo+" mo" : Math.floor(mo/12)+" yr "+(mo%12)+" mo"; }
const foalName = fo => fo.name || `${yrs(fo.foaledOn)} ${(fo.sex||"foal").toLowerCase()} out of ${S.mares[fo.damId] ? S.mares[fo.damId].name : "unknown dam"}`;
const damName = fo => S.mares[fo.damId] ? S.mares[fo.damId].name : (fo.damName || "Dam removed");
function prodCost(fo){
  if (Number(fo.prodOverride)) return {total:Number(fo.prodOverride), direct:Number(fo.prodOverride), overhead:0, manual:true};
  if (!fo.foaledOn || !fo.damId) return {total:0, direct:0, overhead:0};
  const start = fo.coverDate ? addDays(fo.coverDate, -120) : addDays(fo.foaledOn, -460);
  let direct = 0, overhead = 0;
  for (const e of arr("expenses")){
    if (!isExp(e) || e.foalId || e.date < start || e.date > fo.foaledOn) continue;
    if ((e.mareIds||[]).length) direct += share(e, fo.damId); else overhead += (Number(e.amount)||0) / mareCount();
  }
  return {total: direct + overhead, direct, overhead};
}
function foalPL(id){
  const fo = S.foals[id]; const ex = arr("expenses").filter(e => e.foalId === id);
  const add = l => l.reduce((s,e) => s + (Number(e.amount)||0), 0);
  let revenue = add(ex.filter(e => !isExp(e)));
  const sold = fo.status === "sold";
  if (!revenue && sold) revenue = Number(fo.soldPrice)||0;
  const saleCosts = add(ex.filter(e => isExp(e) && SALE_CATS.includes(e.cat)));
  const raising = add(ex.filter(e => isExp(e) && !SALE_CATS.includes(e.cat)));
  const end = sold && fo.soldOn ? fo.soldOn : fo.status === "lost" && fo.lostOn ? fo.lostOn : TODAY;
  const keepMo = fo.foaledOn ? Math.max(0, diff(end, fo.foaledOn) / 30.44) : 0;
  const keep = keepMo * (Number(prices().foalKeep)||0);
  const prod = prodCost(fo);
  const cost = prod.total + raising + keep + saleCosts;
  const asking = Number(fo.asking)||0;
  return {fo, revenue, saleCosts, raising, keep, keepMo, prod, cost, sold, asking,
    profit: sold ? revenue - cost : fo.status === "lost" ? -cost : null,
    projected: !sold && asking ? asking - cost : null,
    margin: sold && revenue ? (revenue - cost) / revenue : null};
}
const plCls = v => v == null ? "" : v < 0 ? "neg" : "pos";
function foalCard(id){
  const fo = S.foals[id], pl = foalPL(id);
  const right = pl.sold ? `<span><b>${money(pl.revenue,false)}</b> sold · <span class="${plCls(pl.profit)}-t">${pl.profit>=0?"+":""}${money(pl.profit,false)}</span></span>`
    : pl.asking ? `<span>asking <b>${money(pl.asking,false)}</b> · <span class="${plCls(pl.projected)}-t">${pl.projected>=0?"+":""}${money(pl.projected,false)}</span></span>` : `<span>—</span>`;
  return `<button class="mare" data-foal="${id}">
    <div class="mare-h"><h3>${esc(foalName(fo))}${fo.sample?'<span class="tag">Sample</span>':""}</h3><span class="pill fs-${fo.status}">${FSTATUS[fo.status]||"On the ground"}</span></div>
    <div class="sub">${esc([fo.sex, fo.color, fo.foaledOn ? yrs(fo.foaledOn)+" · "+ageLabel(fo.foaledOn) : ""].filter(Boolean).join(" · "))}</div>
    <div class="next muted">by ${esc(fo.sire||"unknown sire")} · out of ${esc(damName(fo))}</div>
    <div class="spent"><span>All-in cost <b>${money(pl.cost,false)}</b></span>${right}</div>
  </button>`;
}
function viewFoals(){
  const all = arr("foals"), fl = ui.foalFilter;
  const list = all.filter(f => fl === "all" || (fl === "ground" ? (f.status === "raising" || f.status === "listed") : f.status === fl))
    .sort((a,b) => (b.foaledOn||"").localeCompare(a.foaledOn||""));
  const pls = all.map(f => foalPL(f.id)), sold = pls.filter(p => p.sold);
  const prof = sold.reduce((s,p) => s + p.profit, 0), inv = pls.filter(p => p.fo.status === "raising" || p.fo.status === "listed");

      ${kpi("On the ground", inv.length, money(inv.reduce((s,p)=>s+p.cost,0),false)+" invested")}
      ${kpi("For sale", money(inv.reduce((s,p)=>s+p.asking,0),false), "total asking")}

function plTable(pl){
  const row = (l, v, sub, cls) => `<div class="pl-r ${cls||""}"><span>${l}${sub?`<small>${sub}</small>`:""}</span><span class="money">${v}</span></div>`;
  const top = pl.sold ? row("Sale price", money(pl.revenue)) : pl.asking ? row("Asking price", money(pl.asking), "not sold yet") : row("Sale price", "—", "not listed");
  return `<div class="pl">${top}
    ${row("Cost to produce", "−"+money(pl.prod.total,false).replace("−",""), pl.prod.manual ? "entered by hand" : `dam's costs from 120 days before cover to foaling · ${money(pl.prod.direct,false)} direct + ${money(pl.prod.overhead,false)} barn share`)}
    ${row("Raising costs", "−"+money(pl.raising,false), "vet, training, registration charged to the foal")}
    ${row("Keep", "−"+money(pl.keep,false), `${pl.keepMo.toFixed(1)} mo × ${money(prices().foalKeep||0)}/mo feed & board`)}
    ${row("Sale costs", "−"+money(pl.saleCosts,false), "commission, entry fees, photos & video")}
    ${pl.sold || pl.fo.status==="lost" ? row("Profit", money(pl.profit,false), pl.margin!=null?Math.round(pl.margin*100)+"% margin":"", "tot "+plCls(pl.profit)) : pl.asking ? row("Projected at asking", money(pl.projected,false), "before commission", "tot "+plCls(pl.projected)) : row("Invested so far", money(pl.cost,false), "", "tot")}
  </div>`;
}

function mareFoals(id){
  const fs = arr("foals").filter(f => f.damId === id).sort((a,b) => (b.foaledOn||"").localeCompare(a.foaledOn||""));
  if (!fs.length && !canWrite) return "";
  const pls = fs.map(f => foalPL(f.id)), sold = pls.filter(p => p.sold), prof = sold.reduce((s,p) => s + p.profit, 0);
  return `<section class="sec"><div class="sec-h"><h2>Her foals</h2>${sold.length?`<span class="eyebrow">${sold.length} sold · <span class="${plCls(prof)}-t">${prof>=0?"+":""}${money(prof,false)}</span></span>`:""}<span class="sp"></span>${canWrite?`<button class="btn sm" data-cact="add-foal" data-mare-id="${id}">+ Past foal</button>`:""}</div>
    ${fs.length ? `<div class="mares">${fs.map(f => foalCard(f.id)).join("")}</div>` : `<div class="list"><div class="empty-row">Add her past foals to see what her babies cost and sold for.</div></div>`}</section>`;
}
function profitSection(p){
  const [a,b] = range(p);
  const all = arr("foals").map(f => foalPL(f.id));
  const sold = all.filter(x => x.sold && x.fo.soldOn >= a && x.fo.soldOn <= b).sort((x,y) => y.fo.soldOn.localeCompare(x.fo.soldOn));
  const inv = all.filter(x => x.fo.status === "raising" || x.fo.status === "listed");
  if (!all.length) return `<section class="sec"><div class="sec-h"><h2>Breeding profit</h2></div><div class="list"><div class="empty-row">Record foalings and foal sales to see profit per foal, by sire and by dam.</div></div></section>`;
  const T = sold.reduce((s,x) => ({rev:s.rev+x.revenue, cost:s.cost+x.cost, prof:s.prof+x.profit}), {rev:0,cost:0,prof:0});
  const groups = key => { const g = {}; for (const x of all.filter(x => x.sold)){ const k = key(x.fo) || "Unknown"; (g[k] = g[k] || []).push(x); }
    return Object.entries(g).map(([k,l]) => ({k, n:l.length, rev:l.reduce((s,x)=>s+x.revenue,0)/l.length, cost:l.reduce((s,x)=>s+x.cost,0)/l.length, prof:l.reduce((s,x)=>s+x.profit,0)/l.length, tot:l.reduce((s,x)=>s+x.profit,0)})).sort((x,y) => y.prof - x.prof); };
  const gtable = (title, rows) => rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>${title}</th><th>Sold</th><th>Avg sale</th><th>Avg all-in cost</th><th>Avg profit</th><th>Total</th></tr></thead><tbody>${rows.map(r => `<tr><td style="cursor:default">${esc(r.k)}</td><td>${r.n}</td><td>${money(r.rev,false)}</td><td>${money(r.cost,false)}</td><td class="${plCls(r.prof)}">${money(r.prof,false)}</td><td class="${plCls(r.tot)}">${money(r.tot,false)}</td></tr>`).join("")}</tbody></table></div>` : "";
  return `<section class="sec"><div class="sec-h"><h2>Breeding profit</h2><span class="eyebrow">Foals sold · ${PERIODS[p].toLowerCase()}</span></div>
    <div class="kpis">
      ${kpi("Foals sold", sold.length, sold.length ? "avg "+money(T.rev/sold.length,false) : "none in period")}
      ${kpi("Revenue", money(T.rev,false), "sale prices")}
      ${kpi("All-in cost", money(T.cost,false), sold.length ? "avg "+money(T.cost/sold.length,false)+" per foal" : "")}
      ${kpi("Profit", money(T.prof,false), T.rev ? Math.round(T.prof/T.rev*100)+"% margin · "+(T.cost?Math.round(T.prof/T.cost*100):0)+"% return" : "", T.prof<0?"warn":sold.length?"good":"")}
    </div>
    ${sold.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Foal</th><th>Sold</th><th>Price</th><th>Produce</th><th>Raise + keep</th><th>Sale costs</th><th>Profit</th></tr></thead><tbody>
      ${sold.map(x => `<tr><td data-foal="${x.fo.id}">${esc(foalName(x.fo))}<div class="muted" style="font-size:12px;font-weight:500">by ${esc(x.fo.sire||"?")} · ${esc(damName(x.fo))}</div></td><td>${short(x.fo.soldOn)} ${yrs(x.fo.soldOn)}</td><td>${money(x.revenue,false)}</td><td>${money(x.prod.total,false)}</td><td>${money(x.raising+x.keep,false)}</td><td>${money(x.saleCosts,false)}</td><td class="${plCls(x.profit)}">${money(x.profit,false)}</td></tr>`).join("")}
      <tr class="tot"><td>Total</td><td></td><td>${money(T.rev,false)}</td><td>${money(sold.reduce((s,x)=>s+x.prod.total,0),false)}</td><td>${money(sold.reduce((s,x)=>s+x.raising+x.keep,0),false)}</td><td>${money(sold.reduce((s,x)=>s+x.saleCosts,0),false)}</td><td class="${plCls(T.prof)}">${money(T.prof,false)}</td></tr>
    </tbody></table></div>` : ""}
    ${inv.length ? `<div class="sec-h" style="margin-top:6px"><h3 style="font-size:16px">Inventory on the ground</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Foal</th><th>Age</th><th>Cost to date</th><th>Asking</th><th>Projected</th></tr></thead><tbody>
      ${inv.map(x => `<tr><td data-foal="${x.fo.id}">${esc(foalName(x.fo))}</td><td>${ageLabel(x.fo.foaledOn)}</td><td>${money(x.cost,false)}</td><td>${x.asking?money(x.asking,false):"—"}</td><td class="${plCls(x.projected)}">${x.projected!=null?money(x.projected,false):"—"}</td></tr>`).join("")}
    </tbody></table></div>` : ""}
    ${groups(f => f.sire).length ? `<div class="sec-h" style="margin-top:6px"><h3 style="font-size:16px">By sire</h3><span class="eyebrow">All sold foals</span></div>${gtable("Sire", groups(f => f.sire))}
    <div class="sec-h" style="margin-top:6px"><h3 style="font-size:16px">By dam</h3><span class="eyebrow">All sold foals</span></div>${gtable("Dam", groups(f => damName(f)))}` : ""}
    <p class="hint">All-in cost = dam's costs from 120 days before cover through foaling (stud fee, vet, shots, her share of barn overhead) + the foal's own costs + keep at ${money(prices().foalKeep||0)}/mo + sale costs. Keep rate is set in Prices.</p>
  </section>`;
}

    <div class="row-btns"><button class="btn primary" type="submit">${fid?"Save":"Add foal"}</button><button class="btn" type="button" data-close>Cancel</button>${fid?`<button class="btn danger" type="button" id="delFoal">Delete</button>`:""}</div>

    f.addEventListener("submit", async ev => { ev.preventDefault();

      if (S.mares[d.damId]) d.damName = S.mares[d.damId].name;

      if (d.foaledOn && (!fid || d.foaledOn !== fo.foaledOn)) await genFoalTasks(nid, d, diff(TODAY, d.foaledOn) > 30 ? TODAY : null);
      ui.foal = nid; ui.mare = null; render(); toast(fid ? "Saved" : "Foal added · care schedule created"); });
    const df = root.querySelector("#delFoal"); df && df.addEventListener("click", () => {

function saleForm(fid){
  const fo = S.foals[fid], pl = foalPL(fid);
  sheet(`<h2>Record sale · ${esc(foalName(fo))}</h2><form class="form" id="slf">
    <div class="two"><div class="field"><label for="sl-price">Sale price ($)</label><input id="sl-price" name="price" inputmode="decimal" required value="${esc(fo.asking||"")}"></div>
    <div class="field"><label for="sl-date">Sale date</label><input id="sl-date" name="date" type="date" required value="${TODAY}"></div></div>
    <div class="two"><div class="field"><label for="sl-buyer">Buyer</label><input id="sl-buyer" name="buyer"></div>
    <div class="field"><label for="sl-type">How sold</label><select id="sl-type" name="saleType">${SALE_TYPES.map(x=>`<option>${x}</option>`).join("")}</select></div></div>
    <div class="two"><div class="field"><label for="sl-comm">Commission (%)</label><input id="sl-comm" name="comm" inputmode="decimal" placeholder="0"></div>
    <div class="field"><label for="sl-fees">Sale & entry fees ($)</label><input id="sl-fees" name="fees" inputmode="decimal" placeholder="0"></div></div>
    <div class="field"><label for="sl-mkt">Marketing, photos & video ($)</label><input id="sl-mkt" name="mkt" inputmode="decimal" placeholder="0"></div>
    <div class="pl" id="slPrev"></div>
    <div class="row-btns"><button class="btn primary" type="submit">Record sale</button><button class="btn" type="button" data-close>Cancel</button></div></form>`, root => {
    const f = root.querySelector("#slf"), prev = root.querySelector("#slPrev");
    const base = pl.cost - pl.saleCosts;
    const upd = () => { const pr = num(val(f,"price")), sc = pr * num(val(f,"comm"))/100 + num(val(f,"fees")) + num(val(f,"mkt")) + pl.saleCosts, p = pr - base - sc;
      prev.innerHTML = `<div class="pl-r"><span>Sale price</span><span class="money">${money(pr)}</span></div><div class="pl-r"><span>All-in cost before sale<small>produce + raise + keep</small></span><span class="money">−${money(base,false)}</span></div><div class="pl-r"><span>Sale costs</span><span class="money">−${money(sc)}</span></div><div class="pl-r tot ${plCls(p)}"><span>Profit</span><span class="money">${money(p,false)}</span></div>`; };
    upd(); f.addEventListener("input", upd);
    f.addEventListener("submit", async ev => { ev.preventDefault();
      const pr = num(val(f,"price")), dt = val(f,"date"), buyer = val(f,"buyer"); if (!pr){ toast("Enter the sale price"); return; }
      const nm = foalName(fo), meta = {mareIds:[], foalId:fid, date:dt, status:"paid", method:"", paidBy:me.id, createdBy:me.id, createdAt:new Date().toISOString(), sample:!!fo.sample};
      close();
      await put("foals", fid, {...fo, status:"sold", soldOn:dt, soldPrice:pr, buyer, saleType:val(f,"saleType")});
      for (const e of arr("expenses")) if (e.foalId === fid && !isExp(e) && e.cat === "foalsale") await del("expenses", e.id);
      await put("expenses", fid+"_sale", {...meta, kind:"income", cat:"foalsale", title:`${nm} sold`, amount:pr, vendor:buyer});
      const comm = Math.round(pr * num(val(f,"comm")))/100; if (comm) await put("expenses", fid+"_comm", {...meta, kind:"expense", cat:"commission", title:`Commission ${num(val(f,"comm"))}%`, amount:comm});
      const fees = num(val(f,"fees")); if (fees) await put("expenses", fid+"_fees", {...meta, kind:"expense", cat:"commission", title:"Sale & entry fees", amount:fees});
      const mkt = num(val(f,"mkt")); if (mkt) await put("expenses", fid+"_mkt", {...meta, kind:"expense", cat:"marketing", title:"Marketing, photos & video", amount:mkt});
      const p2 = foalPL(fid); toast(`Sold · ${p2.profit>=0?"profit":"loss"} ${money(Math.abs(p2.profit),false)}`); });
  });
}
document.addEventListener("click", async ev => {
  const el = ev.target.closest("[data-foal],[data-fback],[data-ff],[data-bseg],[data-cact],[data-ftask]"); if (!el) return;
  if (el.dataset.ftask){ if (ev.target.closest("[data-toggle]")) return; taskForm(el.dataset.ftask); return; }
  const d = el.dataset;
  if (d.foal){ ui.foal = d.foal; ui.mare = null; render(); window.scrollTo(0,0); return; }
  if ("fback" in d){ ui.foal = null; ui.view = "barn"; ui.barnSeg = "foals"; render(); return; }
  if (d.ff){ ui.foalFilter = d.ff; render(); return; }
  if (d.bseg){ ui.barnSeg = d.bseg; render(); return; }
  const a = d.cact, fid = d.foalId;
  if (a === "add-foal") foalEdit(null, d.mareId);
  else if (a === "add-foal-dob") foalEdit(null, d.mareId, S.mares[d.mareId] && S.mares[d.mareId].foalDate);
  else if (a === "edit-foal") foalEdit(fid);
  else if (a === "sell-foal") saleForm(fid);
  else if (a === "foal-task") taskForm(null, {foalId:fid});
  else if (a === "foal-cost") expForm(null, {kind:"expense", foalId:fid, mareIds:[], cat:"vgen"});
  else if (a === "undo-sale"){ const fo = S.foals[fid]; for (const s of ["_sale","_comm","_fees","_mkt"]) if (S.expenses[fid+s]) await del("expenses", fid+s); await put("foals", fid, {...fo, status: fo.asking ? "listed" : "raising", soldOn:"", soldPrice:0, buyer:"", saleType:""}); toast("Sale undone"); }
});

  if (!ps.length && !add) return "";
  return `<div class="thumbs ${big?"big":""}">${ps.map((p,i) => `<button class="thumb" data-photo="${kind}:${id}:${i}" aria-label="Photo ${i+1}"><img src="${esc(photoUrl(p))}" alt="" loading="lazy"></button>`).join("")}${add}</div>`;
}
const cover = o => (o.photos && o.photos[0]) ? `<img class="cover" src="${esc(photoUrl(o.photos[0]))}" alt="" loading="lazy">` : "";
function chipsFor(m){
  const c = [];
  if (m.maiden === "yes") c.push("Maiden");
  if (m.carry === "no") c.push("Donor only"); else if (m.carry === "yes") c.push("Carry");
  if (isET(m)) c.push("Embryo transfer");
  if (m.lte) c.push("LTE " + m.lte);
  let sc = seasonChip(m);
  if (notPregnant(m)){ const ci = cycleInfo(m, m.id); if (ci && (ci.inHeatNow || (ci.fol && ci.fol.k === "hot"))) sc += `<span class="chip sw-ideal">${ci.fol && ci.fol.k === "hot" ? "Ovulation close" : "In heat window"}</span>`; }
  return c.length || sc ? `<div class="chips">${c.map(x => `<span class="chip">${esc(x)}</span>`).join("")}${sc}</div>` : "";
}

// Receipt scanning with Claude (Claude version only)
async function scanReceipt(root){
  const fileEl = root.querySelector('[name="file"]'), f = fileEl && fileEl.files && fileEl.files[0];
  if (!f){ toast("Choose a receipt photo first"); fileEl && fileEl.click(); return; }
  if (!/^image\//.test(f.type)){ toast("Scanning reads photos (JPG, PNG). PDFs attach but don't scan."); return; }
  const btn = root.querySelector("#scanBtn"); btn.disabled = true; btn.textContent = "Reading receipt…";
  const cats = Object.entries(EXP).map(([k,v]) => `${k} = ${v[0]}`).join("; ");
  try {
    const r = await sampleFn.json(`This image is a receipt or invoice for a horse breeding operation. Reply with only a JSON object: {"vendor": string, "date": "YYYY-MM-DD" or "", "amount": number (the total paid), "title": short description under 8 words, "category": one key from this list, "notes": invoice number or itemized summary under 20 words}. Category keys: ${cats}. Use "" or 0 when unreadable.`, {images:[f], modelTier:"default"});
    const set = (n, v) => { const el = root.querySelector(`[name="${n}"]`); if (el && v != null && v !== "") { el.value = v; el.dispatchEvent(new Event("input", {bubbles:true})); } };
    set("vendor", r.vendor); if (/^\d{4}-\d{2}-\d{2}$/.test(r.date||"")) set("date", r.date); if (Number(r.amount)) set("amount", Number(r.amount).toFixed(2)); set("title", r.title); if (EXP[r.category]) set("cat", r.category); set("notes", r.notes);
    toast("Filled from the receipt. Check it, then save.");
  } catch(e){
    toast(e && e.code === "not_granted" ? "Receipt scanning needs your OK to use Claude." : e && e.code === "rate_limited" ? "Too many scans at once. Try again in a minute." : "Couldn't read that receipt. Fill it in by hand.");
  } finally { btn.disabled = false; btn.textContent = "Scan receipt with AI"; }
}

// Voice or typed exam findings -> action chart fields
function parseFindings(text){
  const t = " " + text.toLowerCase().replace(/millimet(er|re)s?/g, "mm") + " ";
  const words = {one:1,two:2,three:3,four:4};
  const grab = side => { const m = t.match(new RegExp(side + "(?: ovary)?[,: ]+(.*?)(?=\\b(?:left|right|uterus|uterine|tone|edema|good|fair|poor|fluid|notes?)\\b|[,.;]|$)")); return m ? m[1].replace(/\b(has|is|with|a|an)\b/g,"").replace(/\b(cl|ch)\b/g, x => x.toUpperCase()).replace(/\s+/g," ").replace(/^[\s,]+|[\s,]+$/g,"").trim() : ""; };
  let tone = "";
  const ed = t.match(/edema\s*(?:grade\s*)?(one|two|three|1|2|3)/); if (ed) tone = "Edema " + (words[ed[1]] || ed[1]);
  else if (/fluid/.test(t)) tone = "Fluid present"; else if (/\bgood\b/.test(t)) tone = "Good"; else if (/\bfair\b/.test(t)) tone = "Fair"; else if (/\bpoor\b/.test(t)) tone = "Poor";
  const ovulated = /ovulat/.test(t) && !/(not|hasn'?t|has not|no)\s+ovulat/.test(t);
  return {lo: grab("left"), ro: grab("right"), tone, ovulated};
}
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function attachDictation(root){
  const box = root.querySelector("#xSay"), mic = root.querySelector("#xMic"), fill = root.querySelector("#xFill"); if (!box) return;
  fill.addEventListener("click", () => {
    const p = parseFindings(box.value); const set = (n, v) => { const el = root.querySelector(`[name="${n}"]`); if (el && v) el.value = v; };
    set("lo", p.lo); set("ro", p.ro); if (p.tone) set("tone", p.tone); if (p.ovulated) root.querySelector('[name="ovulated"]').checked = true;
    toast("Filled from your notes. Check before saving.");
  });
  if (!mic) return;
  if (!SR){ mic.disabled = true; mic.title = "Dictation isn't available in this browser; type instead."; return; }
  mic.addEventListener("click", () => {
    try {
      const rec = new SR(); rec.lang = "en-US"; rec.interimResults = false;
      mic.textContent = "Listening…"; mic.disabled = true;
      rec.onresult = ev => { box.value = (box.value + " " + ev.results[0][0].transcript).trim(); fill.click(); };
      rec.onerror = () => toast("Couldn't hear that. Type the findings instead.");
      rec.onend = () => { mic.textContent = "Dictate"; mic.disabled = false; };
      rec.start();
    } catch(_){ toast("Dictation isn't available here. Type the findings instead."); mic.textContent = "Dictate"; mic.disabled = false; }
  });
}

  const tomorrow = addDays(TODAY, 1), list = openTasks().filter(t => t.due <= tomorrow);

}
